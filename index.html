<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AR.js Marker Example</title>
<!-- A-Frame 本体 -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<!-- AR.js for A-Frame (CDN) -->
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe
extras@7.7.0/dist/aframe-extras.min.js"></script> 
<style>
body, html { margin:0; padding:0; overflow:hidden; }
.hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: 12px; background: rgba(0,0,0,.6); color: #fff; padding: 6px 10px; border-radius: 8px; font-size: 14px; }
</style>
</head>
  
<body>
<!-- arjs="sourceType: webcam;" で端末カメラを使用 -->
<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
<!-- 既成のHIROマーカーを使う例 -->
<a-marker type="pattern" url="fox.patt"> 
<a-entity id="fox" gltf-model="url(Fox.glb)" 
position="0 0 0" rotation="0 45 0" 
scale="0.008 0.008 0.008" 
animation-mixer="clip: Walk; loop: repeat"> 
</a-entity> 
</a-marker> 

<!-- カメラ -->
<a-entity camera></a-entity>
</a-scene>
<div class="hint">マーカー（HIRO）をかざしてみてください</div>
</body>
</html>
